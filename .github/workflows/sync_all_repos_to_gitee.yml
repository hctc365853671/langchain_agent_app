name: Sync to Gitee SSH
on:
  push:
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: wait for gitee repo ready
        run: sleep 20
      - name: mirror
        uses: Yikun/hub-mirror-action@master
        with:
          src: github/hctc365853671
          dst: gitee/hcccc111
          dst_key: ${{ secrets.GITEE_RSA_PRIVATE_KEY }}
          dst_token: ${{ secrets.GITEE_TOKEN }}
