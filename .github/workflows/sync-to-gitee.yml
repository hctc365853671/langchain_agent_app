name: Sync GitHub to Gitee
on:
  push:
    branches: [ main, master ] # 你需要同步的分支，按需改
  workflow_dispatch: # 支持手动点按钮触发同步

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror to Gitee
        uses: wearerequired/git-mirror-action@master
        env:
          SSH_PRIVATE_KEY: ${{ secrets.GITEE_RSA_PRIVATE_KEY }}
        with:
          # ========== 这里改成你自己的地址 ==========
          source-repo: git@github.com:hctc365853671/langchain_agent_app.git
          destination-repo: git@gitee.com:hcccclll/langchain_agent_app.git
